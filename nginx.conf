events {
    worker_connections 1024;
}

http {
    client_max_body_size 100M;

    upstream backend {
        server backend:8080;
    }

    upstream minio {
        server minio:9000;
    }

    # Редирект HTTP -> HTTPS www
    server {
        listen 80;
        server_name lambdahub.ru www.lambdahub.ru;
        return 301 https://www.lambdahub.ru$request_uri;
    }

    # Редирект голого домена на www
    server {
        listen 443 ssl;
        server_name lambdahub.ru;

        ssl_certificate     /etc/nginx/ssl/fullchain.crt;
        ssl_certificate_key /etc/nginx/ssl/certificate.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        return 301 https://www.lambdahub.ru$request_uri;
    }

    # HTTPS сервер
    server {
        listen 443 ssl;
        server_name www.lambdahub.ru;

        ssl_certificate     /etc/nginx/ssl/fullchain.crt;
        ssl_certificate_key /etc/nginx/ssl/certificate.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Медиафайлы из MinIO (бакет messenger)
        location /messenger/ {
            proxy_pass         http://minio/messenger/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_buffering    off;
        }

        # Проксируем всё на бэкенд
        location / {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket поддержка
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}