server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            websocket:
              max-frame-payload-length: 65536
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: false
          routes:
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: users
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/users/**
            - id: chats
              uri: ${CHAT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/chats/**,/api/messages/**
            - id: media
              uri: ${MEDIA_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/storage/**
            - id: realtime
              # ws:// so Gateway uses WebsocketRoutingFilter (not plain HTTP proxy)
              uri: ${REALTIME_SERVICE_URL:ws://localhost:8085}
              predicates:
                - Path=/api/ws,/api/ws/**
              metadata:
                response-timeout: 3600000
                connect-timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
