github_checks:
  annotations: true  # показывает покрытие прямо в PR на строках

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 0%

parsers:
  go:
    partials_as_hits: false

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

flags:
  unit:
    carryforward: true
  integration:
    carryforward: true

ignore:
  - "**/mock_*.go"
  - "cmd/server/main.go"