services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lambdahub
      POSTGRES_PASSWORD: lambdahub
      POSTGRES_DB: lambdahub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lambdahub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnami/kafka:3.8
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: bitnami/kafka:3.8
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/lambdahub || true;
      exit 0;
      "

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-changeme-jwt-secret-key-32chars-min}
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      CHAT_SERVICE_URL: http://chat-service:8083
      MEDIA_SERVICE_URL: http://media-service:8084
      REALTIME_SERVICE_URL: ws://realtime-service:8085
    depends_on:
      - auth-service
      - user-service
      - chat-service
      - media-service
      - realtime-service

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lambdahub
      SPRING_DATASOURCE_USERNAME: lambdahub
      SPRING_DATASOURCE_PASSWORD: lambdahub
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-changeme-jwt-secret-key-32chars-min}
      CONFIRM_SECRET: ${CONFIRM_SECRET:-changeme-confirm-secret-key-32ch}
      AUTH_DEV_OTP: "true"
      USER_SERVICE_URL: http://user-service:8082
      INTERNAL_KEY: ${INTERNAL_KEY:-internal-dev-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_started

  user-service:
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lambdahub
      SPRING_DATASOURCE_USERNAME: lambdahub
      SPRING_DATASOURCE_PASSWORD: lambdahub
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MEDIA_SERVICE_URL: http://media-service:8084
      INTERNAL_KEY: ${INTERNAL_KEY:-internal-dev-key}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  chat-service:
    build:
      context: ..
      dockerfile: services/chat-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lambdahub
      SPRING_DATASOURCE_USERNAME: lambdahub
      SPRING_DATASOURCE_PASSWORD: lambdahub
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USER_SERVICE_URL: http://user-service:8082
      INTERNAL_KEY: ${INTERNAL_KEY:-internal-dev-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  media-service:
    build:
      context: ..
      dockerfile: services/media-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lambdahub
      SPRING_DATASOURCE_USERNAME: lambdahub
      SPRING_DATASOURCE_PASSWORD: lambdahub
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: lambdahub
      INTERNAL_KEY: ${INTERNAL_KEY:-internal-dev-key}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_healthy

  realtime-service:
    build:
      context: ..
      dockerfile: services/realtime-service/Dockerfile
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-changeme-jwt-secret-key-32chars-min}
      CHAT_SERVICE_URL: http://chat-service:8083
      INTERNAL_KEY: ${INTERNAL_KEY:-internal-dev-key}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  minio_data:
