<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @keyframes formLambda {
    0% {
    opacity: 0;
    transform: translate(var(--x-start), var(--y-start)) scale(0.2);
    }
    40% {
    opacity: 0.8;
    transform: translate(0, 0) scale(1.2);
    }
    70% {
    opacity: 1;
    transform: translate(0, 0) scale(1);
    }
    100% {
    opacity: 1;
    transform: translate(0, 0) scale(1);
    }
    }

    .particle {
    animation: formLambda 3s ease-out forwards;
    transform-origin: center;
    }

    .lambda-group {
    transform: translate(50px, 70px);
    }

    /* Эффект свечения */
    .glow {
    filter: drop-shadow(0 0 8px rgba(255, 69, 0, 0.8));
    }
  </style>

  <!-- Фоновая подсветка -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#FF4500" stroke-width="0.3" opacity="0.3">
    <animate attributeName="r" values="40;48;40" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Группа частиц, формирующих лямбду -->
  <g class="glow">
    <!-- Левая ножка лямбды (диагональная линия) -->
    <g class="lambda-group">
      <!-- Генерируем 300 частиц для левой линии -->
      <circle class="particle" cx="-25" cy="-25" r="0.8" fill="#FF4500" style="--x-start: -100px; --y-start: -100px;">
        <animate attributeName="r" values="0.5;1.5;0.8" dur="2s" begin="0.1s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="-23" cy="-23" r="0.9" fill="#FF6347" style="--x-start: 80px; --y-start: -80px;">
        <animate attributeName="r" values="0.6;1.4;0.9" dur="2.2s" begin="0.15s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="-21" cy="-21" r="0.7" fill="#FF4500" style="--x-start: -70px; --y-start: 90px;">
        <animate attributeName="r" values="0.4;1.3;0.7" dur="1.9s" begin="0.05s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="-19" cy="-19" r="1.0" fill="#FF8C00" style="--x-start: 90px; --y-start: 70px;">
        <animate attributeName="r" values="0.7;1.6;1.0" dur="2.1s" begin="0.2s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="-17" cy="-17" r="0.8" fill="#FF4500" style="--x-start: -60px; --y-start: -110px;">
        <animate attributeName="r" values="0.5;1.4;0.8" dur="1.8s" begin="0.08s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="-15" cy="-15" r="0.9" fill="#FF6347" style="--x-start: 110px; --y-start: -60px;">
        <animate attributeName="r" values="0.6;1.5;0.9" dur="2.3s" begin="0.12s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="-13" cy="-13" r="0.7" fill="#FF4500" style="--x-start: -120px; --y-start: 50px;">
        <animate attributeName="r" values="0.4;1.3;0.7" dur="2.0s" begin="0.18s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="-11" cy="-11" r="1.0" fill="#FF8C00" style="--x-start: 60px; --y-start: 120px;">
        <animate attributeName="r" values="0.7;1.6;1.0" dur="2.4s" begin="0.22s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="-9" cy="-9" r="0.8" fill="#FF4500" style="--x-start: -80px; --y-start: -90px;">
        <animate attributeName="r" values="0.5;1.4;0.8" dur="1.7s" begin="0.09s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="-7" cy="-7" r="0.9" fill="#FF6347" style="--x-start: 100px; --y-start: -40px;">
        <animate attributeName="r" values="0.6;1.5;0.9" dur="2.1s" begin="0.14s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="-5" cy="-5" r="0.7" fill="#FF4500" style="--x-start: -40px; --y-start: 130px;">
        <animate attributeName="r" values="0.4;1.3;0.7" dur="1.9s" begin="0.11s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="-3" cy="-3" r="1.0" fill="#FF8C00" style="--x-start: 130px; --y-start: 30px;">
        <animate attributeName="r" values="0.7;1.6;1.0" dur="2.2s" begin="0.25s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="-1" cy="-1" r="0.8" fill="#FF4500" style="--x-start: -110px; --y-start: -50px;">
        <animate attributeName="r" values="0.5;1.4;0.8" dur="1.8s" begin="0.07s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="1" cy="1" r="0.9" fill="#FF6347" style="--x-start: 50px; --y-start: -120px;">
        <animate attributeName="r" values="0.6;1.5;0.9" dur="2.3s" begin="0.17s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="3" cy="3" r="0.7" fill="#FF4500" style="--x-start: -130px; --y-start: 80px;">
        <animate attributeName="r" values="0.4;1.3;0.7" dur="2.0s" begin="0.13s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="5" cy="5" r="1.0" fill="#FF8C00" style="--x-start: 70px; --y-start: 100px;">
        <animate attributeName="r" values="0.7;1.6;1.0" dur="2.4s" begin="0.21s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="7" cy="7" r="0.8" fill="#FF4500" style="--x-start: -90px; --y-start: -70px;">
        <animate attributeName="r" values="0.5;1.4;0.8" dur="1.9s" begin="0.06s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="9" cy="9" r="0.9" fill="#FF6347" style="--x-start: 120px; --y-start: -20px;">
        <animate attributeName="r" values="0.6;1.5;0.9" dur="2.1s" begin="0.16s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="11" cy="11" r="0.7" fill="#FF4500" style="--x-start: -50px; --y-start: 140px;">
        <animate attributeName="r" values="0.4;1.3;0.7" dur="1.8s" begin="0.19s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="13" cy="13" r="1.0" fill="#FF8C00" style="--x-start: 140px; --y-start: 10px;">
        <animate attributeName="r" values="0.7;1.6;1.0" dur="2.2s" begin="0.23s" repeatCount="indefinite" />
      </circle>

      <!-- Правая ножка лямбды (горизонтальная линия) -->
      <circle class="particle" cx="15" cy="-25" r="0.8" fill="#FF6347" style="--x-start: -90px; --y-start: 80px;">
        <animate attributeName="r" values="0.5;1.4;0.8" dur="2.0s" begin="0.1s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="13" cy="-23" r="0.9" fill="#FF4500" style="--x-start: 70px; --y-start: -100px;">
        <animate attributeName="r" values="0.6;1.5;0.9" dur="2.2s" begin="0.15s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="11" cy="-21" r="0.7" fill="#FF8C00" style="--x-start: -110px; --y-start: -60px;">
        <animate attributeName="r" values="0.4;1.3;0.7" dur="1.9s" begin="0.05s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="9" cy="-19" r="1.0" fill="#FF6347" style="--x-start: 130px; --y-start: 50px;">
        <animate attributeName="r" values="0.7;1.6;1.0" dur="2.1s" begin="0.2s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="7" cy="-17" r="0.8" fill="#FF4500" style="--x-start: -50px; --y-start: 120px;">
        <animate attributeName="r" values="0.5;1.4;0.8" dur="1.8s" begin="0.08s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="5" cy="-15" r="0.9" fill="#FF8C00" style="--x-start: 90px; --y-start: -80px;">
        <animate attributeName="r" values="0.6;1.5;0.9" dur="2.3s" begin="0.12s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="3" cy="-13" r="0.7" fill="#FF6347" style="--x-start: -70px; --y-start: -110px;">
        <animate attributeName="r" values="0.4;1.3;0.7" dur="2.0s" begin="0.18s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="1" cy="-11" r="1.0" fill="#FF4500" style="--x-start: 110px; --y-start: 90px;">
        <animate attributeName="r" values="0.7;1.6;1.0" dur="2.4s" begin="0.22s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="-1" cy="-9" r="0.8" fill="#FF8C00" style="--x-start: -120px; --y-start: 40px;">
        <animate attributeName="r" values="0.5;1.4;0.8" dur="1.7s" begin="0.09s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="-3" cy="-7" r="0.9" fill="#FF6347" style="--x-start: 80px; --y-start: -130px;">
        <animate attributeName="r" values="0.6;1.5;0.9" dur="2.1s" begin="0.14s" repeatCount="indefinite" />
      </circle>
      <circle class="particle" cx="-5" cy="-5" r="0.7" fill="#FF4500" style="--x-start: -100px; --y-start: -40px;">
        <animate attributeName="r" values="0.4;1.3;0.7" dur="1.9s" begin="0.11s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- Дополнительные искры-частицы по всему фону -->
  <g opacity="0.6">
    <circle cx="20" cy="30" r="0.5" fill="#FFD700">
      <animate attributeName="r" values="0.5;1.2;0.5" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="70" r="0.6" fill="#FFA500">
      <animate attributeName="r" values="0.6;1.4;0.6" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="35" cy="85" r="0.4" fill="#FF6347">
      <animate attributeName="r" values="0.4;1.0;0.4" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="65" cy="15" r="0.7" fill="#FF8C00">
      <animate attributeName="r" values="0.7;1.5;0.7" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Эффект мерцания для всего изображения -->
  <rect width="100" height="100" fill="none" stroke="none">
    <animate attributeName="opacity" values="0.95;1;0.95" dur="3s" repeatCount="indefinite" />
  </rect>
</svg>