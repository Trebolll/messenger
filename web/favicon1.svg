<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Фоновое свечение -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#FF4500" stroke-width="2.5" opacity="0.5">
    <animate attributeName="r" values="80;90;80" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Лямбда правильной ориентацией (вершина вверху) -->
  <g transform="translate(100, 85)">
    <!-- Левая ножка (идет вниз налево) -->
    <circle cx="-35" cy="10" r="8" fill="#FF4500">
      <animate attributeName="r" values="6;10;6" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="-30" cy="17" r="9" fill="#FF6347">
      <animate attributeName="r" values="7;11;7" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="-25" cy="24" r="10" fill="#FF8C00">
      <animate attributeName="r" values="8;12;8" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="-20" cy="31" r="9" fill="#FF4500">
      <animate attributeName="r" values="7;11;7" dur="1.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="-15" cy="38" r="8" fill="#FF6347">
      <animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="-10" cy="45" r="9" fill="#FF8C00">
      <animate attributeName="r" values="7;11;7" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="-5" cy="52" r="10" fill="#FF4500">
      <animate attributeName="r" values="8;12;8" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="59" r="9" fill="#FF6347">
      <animate attributeName="r" values="7;11;7" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="5" cy="66" r="8" fill="#FF8C00">
      <animate attributeName="r" values="6;10;6" dur="1.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="10" cy="73" r="9" fill="#FF4500">
      <animate attributeName="r" values="7;11;7" dur="1.5s" repeatCount="indefinite" />
    </circle>

    <!-- Правая ножка (идет вниз направо) -->
    <circle cx="35" cy="10" r="8" fill="#FF8C00">
      <animate attributeName="r" values="6;10;6" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="30" cy="17" r="9" fill="#FF4500">
      <animate attributeName="r" values="7;11;7" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="25" cy="24" r="10" fill="#FF6347">
      <animate attributeName="r" values="8;12;8" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="20" cy="31" r="9" fill="#FF8C00">
      <animate attributeName="r" values="7;11;7" dur="1.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="15" cy="38" r="8" fill="#FF4500">
      <animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="10" cy="45" r="9" fill="#FF6347">
      <animate attributeName="r" values="7;11;7" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="5" cy="52" r="10" fill="#FF8C00">
      <animate attributeName="r" values="8;12;8" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="59" r="9" fill="#FF4500">
      <animate attributeName="r" values="7;11;7" dur="1.1s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Центральная точка (вверху, где соединяются ножки) -->
  <circle cx="100" cy="95" r="12" fill="#FFD700" opacity="0.9">
    <animate attributeName="r" values="10;14;10" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Нижние частицы -->
  <g opacity="0.7">
    <circle cx="70" cy="150" r="5" fill="#FF4500">
      <animate attributeName="r" values="3;7;3" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="130" cy="150" r="6" fill="#FF6347">
      <animate attributeName="r" values="4;8;4" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>