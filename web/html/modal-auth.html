  <!-- Auth Modal -->
  <div id="auth-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
    <div id="auth-modal" class="bg-custom-main w-full max-w-md rounded-3xl shadow-2xl relative overflow-hidden transform scale-95 transition-all duration-300">
      <button onclick="closeAuthModal()" class="absolute top-6 right-6 text-custom-muted hover:text-custom-main transition"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
      <div id="login-form-container" class="p-8 sm:p-12">
        <div class="text-center mb-8"><span class="text-3xl font-bold text-blue-600 mb-2 block">λ</span><h2 class="text-2xl font-bold text-custom-main">Войти в λ</h2></div>
        <form onsubmit="app.auth(event, 'login')" class="space-y-4">
          <div id="login-error" class="hidden text-red-500 text-sm bg-red-50 p-3 rounded-xl border border-red-100"></div>
          <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-custom bg-custom-sidebar text-custom-main outline-none" placeholder="Email">
          <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl border border-custom bg-custom-sidebar text-custom-main outline-none" placeholder="Пароль">
          <button type="submit" class="w-full py-4 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition">Войти</button>
        </form>
        <p class="mt-8 text-center text-custom-muted text-sm">Нет аккаунта? <button onclick="switchForm('register')" class="text-blue-600 font-semibold hover:underline">Зарегистрироваться</button></p>
      </div>
      <div id="register-form-container" class="p-8 sm:p-12 hidden">
        <div class="text-center mb-8"><span class="text-3xl font-bold text-blue-600 mb-2 block">λ</span><h2 class="text-2xl font-bold text-custom-main">Создать аккаунт</h2></div>
        <form onsubmit="app.auth(event, 'register')" class="space-y-4">
          <div id="register-error" class="hidden text-red-500 text-sm bg-red-50 p-3 rounded-xl border border-red-100"></div>
          <input type="text" name="username" required class="w-full px-4 py-3 rounded-xl border border-custom bg-custom-sidebar text-custom-main outline-none" placeholder="Имя пользователя">
          <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-custom bg-custom-sidebar text-custom-main outline-none" placeholder="Email">
          <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl border border-custom bg-custom-sidebar text-custom-main outline-none" placeholder="Пароль (мин. 6 символов)">
          <button type="submit" class="w-full py-4 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition">Зарегистрироваться</button>
        </form>
        <p class="mt-8 text-center text-custom-muted text-sm">Уже есть аккаунт? <button onclick="switchForm('login')" class="text-blue-600 font-semibold hover:underline">Войти</button></p>
      </div>
    </div>
  </div>
