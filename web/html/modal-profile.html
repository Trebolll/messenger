<!-- Profile Modal -->
<div id="profile-overlay" class="fixed inset-0 z-[100] hidden opacity-0 pointer-events-none transition-all duration-300">
  <div id="profile-modal" class="profile-side-panel fixed left-0 top-0 bottom-0 w-[420px] bg-custom-sidebar shadow-2xl transform -translate-x-full transition-all duration-300 pointer-events-auto flex flex-col">

    <!-- Header -->
    <div class="p-6 flex items-center justify-between border-b border-white/5 bg-custom-sidebar/80 backdrop-blur-md sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <button onclick="saveProfile()" class="p-2 rounded-xl bg-green-500/10 text-green-400 hover:bg-green-500/20 transition-all" title="Сохранить изменения">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
        </button>
        <span class="font-bold text-custom-main">Настройки профиля</span>
      </div>
      <button onclick="closeProfileModal()" class="p-2 rounded-xl hover:bg-white/5 text-custom-muted hover:text-custom-main transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Scrollable Content -->
    <div class="flex-grow overflow-y-auto p-8 space-y-8 scrollbar-hide">

      <!-- Avatar Section -->
      <div class="flex flex-col items-center">
        <div class="relative group cursor-pointer" onclick="triggerAvatarUpload()">
          <div id="profile-avatar" class="w-28 h-28 rounded-full bg-blue-500/20 border-2 border-blue-400/30 flex items-center justify-center text-5xl font-bold text-blue-200 transition group-hover:border-blue-400/60 overflow-hidden shadow-lg shadow-blue-500/10">U</div>
          <div class="absolute inset-0 rounded-full bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center backdrop-blur-[2px]">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </div>
        </div>
        <input type="file" id="profile-avatar-upload" class="hidden" accept="image/*">
        <p class="text-blue-300/50 text-[11px] mt-3 uppercase tracking-wider font-semibold">Нажмите чтобы сменить фото</p>
      </div>

      <!-- Basic Fields Group -->
      <div class="space-y-5">
        <h4 class="text-[11px] uppercase tracking-[0.2em] font-bold text-custom-muted/60 px-1">Основная информация</h4>

        <div class="profile-field">
          <label class="profile-label">Имя пользователя</label>
          <input type="text" id="profile-username" class="profile-input" placeholder="username">
        </div>

        <div class="profile-field">
          <label class="profile-label">Имя и фамилия</label>
          <input type="text" id="profile-fullname" class="profile-input" placeholder="Иван Иванов">
        </div>

        <div class="profile-field">
          <label class="profile-label">Email</label>
          <input type="email" id="profile-email" class="profile-input opacity-60 bg-white/5 cursor-not-allowed" placeholder="you@example.com" disabled title="Email нельзя изменить">
        </div>

        <div class="profile-field">
          <label class="profile-label">Рейтинг</label>
          <div id="profile-rating" class="profile-input opacity-80 bg-white/5 font-bold text-yellow-500 flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
            <span>0</span>
          </div>
        </div>
      </div>

      <!-- Contact & Personal Group -->
      <div class="space-y-5">
        <h4 class="text-[11px] uppercase tracking-[0.2em] font-bold text-custom-muted/60 px-1">Личные данные</h4>

        <div class="profile-field">
          <label class="profile-label">Номер телефона</label>
          <input type="tel" id="profile-phone" class="profile-input" placeholder="+7 (999) 000-00-00">
        </div>

        <div class="profile-field">
          <label class="profile-label">Дата рождения</label>
          <input type="date" id="profile-birthdate" class="profile-input">
        </div>

        <div class="profile-field">
          <label class="profile-label">Локация</label>
          <input type="text" id="profile-location" class="profile-input" placeholder="Город, страна">
        </div>

        <div class="profile-field">
          <label class="profile-label">Профессия</label>
          <input type="text" id="profile-profession" class="profile-input" placeholder="Разработчик, дизайнер...">
        </div>
      </div>

      <!-- Status Group -->
      <div class="space-y-5">
        <h4 class="text-[11px] uppercase tracking-[0.2em] font-bold text-custom-muted/60 px-1">О себе</h4>
        <div class="profile-field">
          <label class="profile-label">Статус</label>
          <input type="text" id="profile-status-text" class="profile-input" placeholder="Настроение, цитата..." maxlength="100">
          <p class="text-blue-300/40 text-[10px] mt-1.5 pl-1 italic">Виден собеседникам в правой панели профиля</p>
        </div>
      </div>

      <!-- Verification Section -->
      <div class="profile-verify-block bg-white/5 border border-white/5 rounded-2xl p-5 space-y-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          </div>
          <span class="text-custom-main text-sm font-bold">Верификация λ</span>
          <span class="ml-auto text-[10px] bg-yellow-500/20 text-yellow-300 border border-yellow-400/20 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">Скоро</span>
        </div>
        <p class="text-custom-muted/70 text-[11px] leading-relaxed">Верификация через паспорт для подтверждения личности. Даёт статус доверенного пользователя и синюю галочку.</p>
      </div>

      <div class="h-10"></div> <!-- Spacer for bottom -->
    </div>
  </div>
</div>
