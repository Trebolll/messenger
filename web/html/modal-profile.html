  <!-- Profile Modal -->
  <div id="profile-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
    <div id="profile-modal" class="profile-modal w-full max-w-sm rounded-3xl relative transform scale-95 transition-all duration-300 p-8">
      <button onclick="closeProfileModal()" class="absolute top-5 right-5 text-blue-300 hover:text-white transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>

      <!-- Avatar -->
      <div class="flex flex-col items-center mb-6">
        <div class="relative group cursor-pointer" onclick="triggerAvatarUpload()">
          <div id="profile-avatar" class="w-24 h-24 rounded-full bg-blue-500/30 border-2 border-blue-400/50 flex items-center justify-center text-4xl font-bold text-blue-200 transition group-hover:border-blue-300 overflow-hidden">U</div>
          <div class="absolute inset-0 rounded-full bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </div>
        </div>
        <input type="file" id="avatar-upload" class="hidden" accept="image/*">
        <p class="text-blue-300/70 text-xs mt-2">Нажмите чтобы сменить фото</p>
      </div>

      <!-- Fields -->
      <div class="space-y-3">
        <div class="profile-field">
          <label class="profile-label">Имя пользователя</label>
          <input type="text" id="profile-username" class="profile-input" placeholder="username">
        </div>
        <div class="profile-field">
          <label class="profile-label">Имя и фамилия</label>
          <input type="text" id="profile-fullname" class="profile-input" placeholder="Иван Иванов">
        </div>
        <div class="profile-field">
          <label class="profile-label">
            <svg class="w-3.5 h-3.5 inline mr-1 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
            Номер телефона
          </label>
          <input type="tel" id="profile-phone" class="profile-input" placeholder="+7 (999) 000-00-00">
        </div>
        <div class="profile-field">
          <label class="profile-label">Email</label>
          <input type="email" id="profile-email" class="profile-input" placeholder="you@example.com" disabled>
          <p class="text-blue-300/50 text-xs mt-1 pl-1">Изменение email недоступно</p>
        </div>
        <div class="profile-field">
          <label class="profile-label">
            <svg class="w-3.5 h-3.5 inline mr-1 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
            Статус
          </label>
          <input type="text" id="profile-status-text" class="profile-input" placeholder="Настроение, цитата..." maxlength="100">
          <p class="text-blue-300/50 text-xs mt-1 pl-1">Виден собеседникам в правой панели</p>
        </div>

        <!-- Верификация -->
        <div class="profile-verify-block">
          <div class="flex items-center gap-2 mb-2">
            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
            <span class="text-blue-200 text-sm font-medium">Привязка к личности</span>
            <span class="ml-auto text-xs bg-yellow-500/20 text-yellow-300 border border-yellow-400/30 px-2 py-0.5 rounded-full">Скоро</span>
          </div>
          <p class="text-blue-300/60 text-xs leading-relaxed">Верификация через Госуслуги или паспорт для подтверждения личности. Даёт синюю галочку профиля.</p>
        </div>
      </div>

      <!-- Save -->
      <button onclick="saveProfile()" class="mt-6 w-full py-3 bg-blue-600/80 hover:bg-blue-600 text-white font-semibold rounded-2xl transition border border-blue-400/30 backdrop-blur-sm">
        Сохранить изменения
      </button>
    </div>
  </div>
