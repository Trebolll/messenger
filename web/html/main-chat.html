<!-- Main Chat -->
<div id="main-chat" class="h-full w-full flex hidden fade-in bg-transparent relative z-10">

  <!-- ═══ Left panel: лента + список чатов ═══ -->
  <div id="left-panel" class="left-panel flex flex-col h-full bg-custom-sidebar" style="z-index:9;">

    <!-- Контент левой панели -->
    <div id="left-panel-content" class="flex-grow flex flex-col overflow-hidden">

      <!-- Лента активности -->
      <div id="view-home" class="flex flex-col h-full">
        <div class="p-4 flex items-center gap-3" style="border-bottom: 1px solid rgba(0,0,0,0.04);">
          <span class="font-bold text-custom-main text-base">Лента</span>
        </div>
        <div class="flex-grow flex flex-col items-center justify-center gap-4 select-none px-6">
          <div style="opacity:0.12;">
            <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M17 20h5v-2a4 4 0 00-5.356-3.779M9 20H4v-2a4 4 0 015.356-3.779M15 7a4 4 0 11-8 0 4 4 0 018 0zm6 3a3 3 0 11-6 0 3 3 0 016 0zM3 10a3 3 0 116 0 3 3 0 01-6 0z"/>
            </svg>
          </div>
          <div class="text-center" style="opacity:0.4;">
            <p class="text-sm font-semibold text-custom-main">Лента активности</p>
            <p class="text-xs text-custom-muted mt-1">Здесь будут события пользователей</p>
          </div>
        </div>
      </div>

      <!-- Список чатов -->
      <div id="chats-sidebar" class="chats-sidebar-inner flex flex-col h-full hidden">
        <div id="chats-list" class="flex-grow overflow-y-auto scrollbar-hide pt-2"></div>
      </div>

    </div>

  </div>

  <!-- ═══ Right: chat view ═══ -->
  <div id="view-chat" class="flex-grow flex flex-col h-full bg-transparent relative hidden" style="z-index:2;">

    <div id="no-chat-selected" class="absolute inset-0 flex items-center justify-center bg-transparent z-10">
      <div class="text-center">
        <div class="text-6xl mb-4 opacity-20">λ</div>
        <h3 class="text-xl font-medium text-custom-muted">Выберите чат для начала общения</h3>
      </div>
    </div>

    <div id="chat-header" class="p-4 border-b border-custom flex items-center justify-between bg-custom-main" style="position:relative;z-index:2;">
      <div class="flex items-center gap-3">
        <!-- Кнопка назад — закрыть чат -->
        <button id="back-btn" onclick="handleBackBtn()" title="Назад" class="p-2 rounded-xl hover:bg-custom-sidebar transition text-custom-muted hover:text-custom-main" style="margin-left:-4px;flex-shrink:0;">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div id="active-chat-avatar" onclick="openAvatarViewer()" class="w-10 h-10 rounded-full bg-custom-sidebar flex items-center justify-center font-bold text-custom-muted cursor-pointer hover:ring-2 hover:ring-blue-400 hover:ring-offset-2 transition">?</div>
        <div>
          <h3 id="active-chat-name" onclick="toggleInfoPanel()" class="font-bold text-custom-main leading-tight cursor-pointer hover:text-blue-600 transition">Чат</h3>
          <p id="active-chat-status" class="text-xs text-custom-muted"></p>
        </div>
      </div>
    </div>

    <div id="messages-container" class="flex-grow overflow-y-auto p-6 space-y-4 bg-custom-sidebar/30 scrollbar-hide" style="position:relative;z-index:2;"></div>

    <!-- Input area -->
    <div id="input-area" class="input-area p-4 border-t border-custom bg-custom-main hidden">

      <!-- AI Panel -->
      <div id="ai-panel" class="hidden mb-3 p-3">
        <p class="ai-panel-title">✦ AI-ассистент</p>
        <div id="ai-loading" class="hidden">Анализирую...</div>
        <div id="ai-result" class="hidden"></div>
        <div class="flex gap-2 flex-wrap">
          <button onclick="aiAction('improve')" class="ai-action-btn ai-action-primary">✨ Улучшить</button>
          <button onclick="aiAction('shorten')" class="ai-action-btn ai-action-secondary">📝 Сократить</button>
          <button onclick="aiAction('tone')" class="ai-action-btn ai-action-secondary">🎯 Тон</button>
          <button onclick="aiAction('continue')" class="ai-action-btn ai-action-secondary">💡 Продолжить</button>
          <button onclick="applyAiResult()" id="ai-apply-btn" class="ai-action-btn ai-action-apply hidden">✅ Применить</button>
        </div>
      </div>

      <!-- File Preview Panel -->
      <div id="file-preview-panel"></div>

      <form id="message-form" class="flex items-end gap-3" onsubmit="handleSendMessage(event)">
        <input type="file" id="file-input" multiple style="display:none;" accept="image/jpeg,image/png,image/gif,audio/webm,audio/ogg,audio/mpeg,video/webm,video/mp4">
        <button type="button" id="attach-btn" onclick="triggerFileInput()" class="p-3" style="position:relative;z-index:20;" title="Прикрепить файл">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>

        <div class="flex-grow msg-input-wrap" style="position:relative;z-index:20;">
                        <textarea id="message-input" rows="1" placeholder="Напишите сообщение..."
                                  class="w-full px-4 py-3 bg-custom-sidebar border-none rounded-2xl outline-none text-sm resize-none text-custom-main placeholder-custom-muted msg-textarea"></textarea>
        </div>

        <!-- AI кнопка — z-index 20 через CSS -->
        <button type="button" id="ai-btn" onclick="toggleAiPanel()" title="AI-ассистент">
          <div class="pulse-ring"></div>
          <div class="pulse-ring"></div>
          <div class="pulse-ring"></div>
          <div class="ai-btn-inner">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2z"/>
              <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/>
              <path d="M5 18l.4 1.2L6.5 20l-1.1.4L5 21.5l-.4-1.1L3.5 20l1.1-.4L5 18z"/>
            </svg>
          </div>
        </button>

        <!-- Самолётик — z-index 20 через CSS -->
        <button type="submit" id="send-btn" class="p-3 bg-blue-600 text-white rounded-2xl hover:bg-blue-700 shadow-md">
                            <span class="plane-icon">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
                                </svg>
                            </span>
          <span class="plane-return">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
                                </svg>
                            </span>
        </button>
      </form>
    </div>
  </div>
  <!-- end #view-chat -->

  <!-- ═══ Right: info panel ═══ -->
  <div id="info-panel" class="w-80 border-l border-custom hidden flex flex-col h-full bg-custom-main fade-in" style="position:relative;z-index:2;">
    <div class="p-4 border-b border-custom flex items-center justify-between">
      <h3 class="font-bold text-custom-main">Информация</h3>
      <button onclick="toggleInfoPanel()" class="text-custom-muted hover:text-custom-main">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="p-8 flex flex-col items-center text-center">
      <div id="info-avatar" class="w-24 h-24 rounded-full bg-blue-50 flex items-center justify-center text-3xl font-bold text-blue-600 mb-4">?</div>
      <h4 id="info-name" class="text-xl font-bold text-custom-main mb-2">Name</h4>
      <div id="info-status-badge" class="info-status-badge offline mb-2">
        <span class="dot"></span>
        <span id="info-status-text">офлайн</span>
      </div>
      <p id="info-user-status" class="text-xs text-custom-muted italic mb-6"></p>
      <div class="w-full space-y-4 text-left"></div>
    </div>
  </div>
</div>


<!-- ═══ Floating bottom dock (position:fixed) ═══ -->
<div id="bottom-dock" role="toolbar" aria-label="Навигация">

  <!-- Чаты -->
  <button class="dock-btn" onclick="switchLeftTab('chats')" id="dock-chats" title="Чаты">
      <span style="position:relative;display:inline-flex;">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        <span id="nav-chats-badge" class="nav-badge hidden"></span>
      </span>
  </button>

  <!-- Лента -->
  <button class="dock-btn" onclick="switchLeftTab('home')" id="dock-home" title="Лента">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a4 4 0 00-5.356-3.779M9 20H4v-2a4 4 0 015.356-3.779M15 7a4 4 0 11-8 0 4 4 0 018 0zm6 3a3 3 0 11-6 0 3 3 0 016 0zM3 10a3 3 0 116 0 3 3 0 01-6 0z"/></svg>
  </button>

  <!-- Новый чат -->
  <button class="dock-btn" onclick="openNewChatMenu()" id="dock-new-chat" title="Новый чат">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
  </button>

  <div class="dock-divider"></div>

  <!-- Профиль -->
  <button id="profile-dock-btn" class="dock-btn dock-btn--avatar" onclick="toggleProfileModal()" title="Профиль">
      <span style="position:relative;display:inline-flex;align-items:center;justify-content:center;">
        <div id="current-user-avatar" class="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold overflow-hidden text-xs">U</div>
        <div id="my-status-dot" class="nav-status-dot" style="width:8px;height:8px;bottom:0;right:0;border-width:1.5px;"></div>
      </span>
  </button>

  <!-- Тема -->
  <button class="dock-btn theme-btn" id="theme-btn" onclick="handleToggleTheme()" title="Сменить тему">
    <span class="theme-icon-wrap" style="width:20px;height:20px;display:block;position:relative;"><svg class="theme-icon theme-sun w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg><svg class="theme-icon theme-moon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg><svg class="theme-icon theme-twilight-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg><svg class="theme-icon theme-dawn-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v3M6.343 6.343L4.222 4.222M3 12H0m21 0h-3M19.778 4.222l-2.121 2.121M12 18a6 6 0 100-12 6 6 0 000 12zm0 0v3M4.929 19.071l1.414-1.414M17.657 17.657l1.414 1.414"/></svg><svg class="theme-icon theme-sunset-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.879 16.121A3 3 0 1012.015 11L11 14H9c0 .768.293 1.536.879 2.121z"/></svg><svg class="theme-icon theme-coral-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg><svg class="theme-icon theme-ocean-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15s1.5-2 4.5-2 4.5 2 4.5 2 1.5-2 4.5-2 4.5 2 4.5 2M3 9s1.5-2 4.5-2 4.5 2 4.5 2 1.5-2 4.5-2 4.5 2 4.5 2"/></svg><svg class="theme-icon theme-mint-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07"/></svg></span>
  </button>

  <!-- Выход -->
  <button class="dock-btn dock-btn--logout" onclick="handleLogout()" title="Выйти">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
  </button>

</div>

</div><!-- /#app -->
