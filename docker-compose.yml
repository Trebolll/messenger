version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: messenger-db
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: z4AU0jnUihNMZ6du9WK9UkHmCsGFDNT
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d messenger"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - messenger-network

  minio:
    image: minio/minio
    container_name: messenger-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - messenger-network

  ollama:
    image: ollama/ollama:latest
    container_name: messenger-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - messenger-network

  backend:
    build:
      context: .
    container_name: messenger-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: messenger
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: www.lambdahub.ru
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      MINIO_BUCKET: messenger
    networks:
      - messenger-network

  nginx:
    image: nginx:alpine
    container_name: messenger-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - messenger-network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  ollama_data:

networks:
  messenger-network: